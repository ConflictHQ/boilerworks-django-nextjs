type Mutation {
  """Authenticate a user with username and password."""
  login(username: String!, password: String!): LoginResult!

  """Logout the current user."""
  logout: Boolean!

  """Switch the active user (impersonation)."""
  switchUser(id: ID!): SwitchUserResult!

  """Upsert user profile via UtilityForm.apply_forms."""
  upsertUser(input: UserInput!): UpsertUserResult!

  """Update user profile via ProfileSerializer (restricted)."""
  profile(input: JSON!): MutationResult!

  """
  Request a password reset email. Requires PROFILE_CHANGE_RESET_PASSWORD_USERS permission to send to other users.
  """
  profileRequestPwdChange(userGid: ID = null): Boolean!

  """
  Request deletion of a user account. Requires PROFILE_DELETE_USERS permission to delete other users.
  """
  profileRequestDeleteUser(userGid: ID = null): Boolean!

  """Update or set the user's PIN."""
  pinUpdate(pin: String!): Boolean!

  """
  Authenticate a PIN transaction. The proxy_user parameter allows acting on behalf of another user.
  """
  pinTransaction(pin: String!, proxyUser: ID = null): Boolean!

  """
  Request a sign from a user. The user must have SIGNREQUEST_CHANGE_SIGN permission.
  """
  signRequestUser(gid: String!, userToRequest: ID!): Boolean!

  """
  Sign a sign request. Requires SIGNREQUEST_CHANGE_SIGN permission and an active PIN transaction. Status must be SIGN_REQUIRED.
  """
  signRequestSign(gid: String!): Boolean!

  """Cancel a sign request. Requires SIGNREQUEST_CHANGE_CANCEL permission."""
  signRequestCancel(gid: String!, note: String!): Boolean!

  """Create or update a notification via NotificationSerializer."""
  notification(input: JSON!): MutationResult!

  """Mark a notification as read."""
  notificationRead(gid: ID!): Boolean!

  """Add or remove users from a permission group."""
  permissionGroupOperation(input: GroupOperationInput!): MutationResult!

  """Create a new directory in the library."""
  libraryMkdir(name: String!, parentGuid: ID = null, icon: ID = null): LibraryMkdirResult!

  """Remove a directory from the library."""
  libraryRmdir(directoryGuid: ID!): Boolean!

  """Rename a directory in the library."""
  libraryRenameDir(name: String!, guid: ID!): LibraryRenameDirectoryResult!

  """Rename a file in the library."""
  libraryRenameFile(name: String!, guid: ID!): LibraryRenameFileResult!

  """Remove a file from a library directory."""
  libraryRmFile(directory: ID!, file: ID!): LibraryRmFileResult!

  """Set the icon for a library directory."""
  librarySetIcon(directory: ID!, file: ID!): LibrarySetIconResult!

  """
  Generate a temporary authentication token for Rocket.Chat. TTL is configured on the Rocket.Chat server.
  """
  generateRocketChatToken: String!

  """Create or update a Metabase chart via MetabaseChartSerializer."""
  metabaseChart(input: JSON!): MutationResult!

  """
  Get a pre-signed URL for uploading an image or file. Optionally attach it to an entity via owner_container_property.
  """
  preSignedUrlImageUpload(globalId: ID!, mimetype: String!, uuid: UUID = null, metadata: JSON = null, location: UploadLocation = null, description: String = null, name: String = null, ownerContainerProperty: String = null): PreSignedUrlUploadResult!

  """
  Confirm or update a previously uploaded file. Set delete=true to soft-delete the upload.
  """
  confirmPreSignedUrlImageUpload(publicUrl: String = null, metadata: JSON = null, delete: Boolean = null, uploadId: ID = null, expirationDate: Date = null): ConfirmUploadResult!

  """Upload a data import file and get a pre-signed URL."""
  uploadTextFile(mimetype: String!, metadata: JSON = null): DataImportUploadResult!

  """Process a previously uploaded data import file."""
  processFile(entityType: EntityType!, uploadedFileId: ID!, processId: ID = null): ProcessFileResult!

  """
  Upload a file and get a pre-signed URL. Creates a FileUpload wrapper around the Upload.
  """
  fileUpload(mimetype: String!, fileUploadGid: ID = null, metadata: JSON = null, name: String = null, description: String = null, isPublic: Boolean = false): FileUploadResult!

  """
  Upload an image for a specific profile image field (avatar, signature). Supports the approval request workflow for non-whitelisted fields.
  """
  profileImageFieldUpload(globalId: ID!, mimetype: String!, field: ProfileImageField = null, metadata: JSON = null): ProfileImageFieldUploadResult!

  """Delete an object by its global ID (soft-delete via delete_check)."""
  delete(gid: ID!): Boolean!

  """Activate or deactivate an object by its global ID."""
  activate(gid: ID!, active: Boolean! = true): Boolean!
  component(input: ComponentInput!): ComponentMutationResult!
  organization(input: OrganizationInput!): OrganizationMutationResult!
  upsertOrganization(input: UpsertOrganizationInput!): OrganizationMutationResult!
  organizationMemberStatus(input: OrganizationMemberStatusInput!): MutationResult!

  """Create a new form definition (draft)."""
  createFormDefinition(input: FormDefinitionInput!): MutationResult!

  """Publish a draft form definition."""
  publishForm(slug: String!): MutationResult!

  """Archive a published form definition."""
  archiveForm(slug: String!): MutationResult!

  """Create a new draft from an existing form's schema."""
  newFormDraft(slug: String!): MutationResult!

  """
  Submit data against a published form. Validates payload against the form's JSON Schema.
  """
  submitForm(slug: String!, payload: JSON!): FormSubmitResult!

  """
  Update the status of a form submission (in_review, approved, rejected).
  """
  updateSubmissionStatus(submissionId: ID!, status: String!): MutationResult!
  deviceToken(input: DeviceTokenInput!): MutationResult!
  notificationConfig(input: NotificationConfigInput!): MutationResult!
}

