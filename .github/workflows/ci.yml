name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          # Fall back to HEAD~1 if before-sha is unknown (first push to branch)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          pre-commit run --from-ref "$BASE" --to-ref "${{ github.sha }}"

  brain:
    name: Brain node
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate app/brain.json against schemas
        run: python3 scripts/validate_brain.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_API_ROOT: http://localhost:8000/
      NEXT_PUBLIC_API_TOKEN: Bearer ci-not-a-real-token
      NEXT_PUBLIC_MAIN_PAGE: /dashboard
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Prettier check
        run: npm run format:check
      - name: Unit tests
        run: npm run test -- --run
      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dbadmin
          POSTGRES_PASSWORD: Password123
          POSTGRES_DB: boilerworks
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_CONFIGURATION: Tests
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      POSTGRES_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: boilerworks
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: Password123
      DJANGO_CACHE_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv requirements --dev | pip install -r /dev/stdin
      - name: Install coverage
        run: pip install coverage
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests with coverage
        run: |
          coverage run --source='core/schema,core_ui/schema,organization/schema,pushnotif/schema,forms,workflows' manage.py test
          coverage report --fail-under=75
          coverage xml -o coverage.xml
      - name: Export GraphQL schema SDL
        run: python manage.py shell -c "from config.schema import schema; print(schema.as_str())" > schema.graphql
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
      - name: Check for schema changes
        if: github.event_name == 'pull_request'
        run: |
          if [ -f ../schema.graphql ]; then
            if ! diff -q schema.graphql ../schema.graphql > /dev/null 2>&1; then
              echo "⚠️ GraphQL schema has changed in this PR"
              echo "::warning::GraphQL schema has changed — review schema.graphql diff"
              diff ../schema.graphql schema.graphql || true
            else
              echo "✅ GraphQL schema unchanged"
            fi
          else
            echo "📝 No committed schema.graphql to compare against"
          fi
      - name: Commit schema SDL if changed
        if: github.ref == 'refs/heads/main'
        run: |
          cp schema.graphql ../schema.graphql
      - name: Upload schema SDL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-sdl
          path: backend/schema.graphql

  smoke:
    name: Fresh-clone smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap as a pristine user
        # Exactly what a fresh clone runs: creates backend/config/local.env
        # from example.env, generates a secret key, builds the backend image.
        run: ./bootstrap.sh
      - name: Start core stack (backend + postgres + redis)
        # Only the core services; ui/minio/opensearch/celery are omitted to
        # stay inside the time budget. --wait blocks on the postgres/redis
        # healthchecks; the backend then runs migrations before serving.
        run: docker compose -f docker/docker-compose.yaml up -d --wait boilerworks-local
      - name: GraphQL endpoint serves (non-500)
        run: |
          for i in $(seq 1 36); do
            code=$(curl -s -o /tmp/gql-response -w '%{http_code}' \
              -X POST http://localhost:8000/app/gql/config/ \
              -H 'Content-Type: application/json' \
              -d '{"query":"{ __typename }"}' || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              cat /tmp/gql-response; echo; exit 0
            fi
            sleep 5
          done
          echo "GraphQL endpoint never returned a non-5xx response"
          exit 1
      - name: Compose services healthy
        run: |
          docker compose -f docker/docker-compose.yaml ps
          test "$(docker inspect -f '{{.State.Health.Status}}' postgres-local)" = "healthy"
          test "$(docker inspect -f '{{.State.Health.Status}}' redis-local)" = "healthy"
          test "$(docker inspect -f '{{.State.Running}}' boilerworks-local)" = "true"
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yaml logs --tail=200
      - name: Teardown
        if: always()
        run: docker compose -f docker/docker-compose.yaml down -v
